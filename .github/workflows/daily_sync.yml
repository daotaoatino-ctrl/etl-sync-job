name: Daily 1Office sync

on:
  schedule:
    # 05:00 giờ Việt Nam (22:00 UTC hôm trước). GitHub có thể trễ tới ~1 giờ,
    # một lần sync mất ~15 phút → xong trước 07:30.
    - cron: '0 22 * * *'
  workflow_dispatch: # Chạy tay: Actions → Daily 1Office sync → Run workflow

permissions:
  contents: write # chỉ dùng cho bước "giữ repo hoạt động" ở cuối

# Không cho 2 lần sync chạy chồng nhau (ghi WRITE_TRUNCATE vào RAW/MART).
concurrency:
  group: daily-1office-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 1Office → BigQuery → dbt
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Repo PUBLIC → log công khai. Mọi giá trị nhạy cảm đều là secret (GitHub tự che trong log).
      OFFICE_ACCESS_TOKEN: ${{ secrets.OFFICE_ACCESS_TOKEN }}
      OFFICE_API_BASE_URL: ${{ secrets.OFFICE_API_BASE_URL }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_DATASET_ID: DWH_1OFFICE
      PYTHONUTF8: '1'

    steps:
      - name: Kiểm tra secret
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for v in OFFICE_ACCESS_TOKEN OFFICE_API_BASE_URL GCP_PROJECT_ID GCP_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!v}" ]; then
              echo "::error::Thiếu secret $v (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit $missing

      - name: Che tên miền 1Office trong log
        # GitHub chỉ che NGUYÊN giá trị secret; thông báo lỗi của requests lại in riêng tên miền.
        run: |
          host=$(python3 -c "import os; from urllib.parse import urlparse; print(urlparse(os.environ['OFFICE_API_BASE_URL']).hostname or '')")
          if [ -n "$host" ]; then echo "::add-mask::$host"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ghi key BigQuery (tạm thời)
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-key.json"
          echo "GCP_KEY_PATH=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Cấu hình dbt
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<EOF
          office_transform:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: service-account
                project: ${GCP_PROJECT_ID}
                dataset: DWH_1OFFICE
                threads: 4
                keyfile: ${GCP_KEY_PATH}
                timeout_seconds: 300
                location: US
                priority: interactive
          EOF
          cd office_transform
          dbt deps --profiles-dir "$HOME/.dbt"

      - name: Chạy sync
        id: sync
        run: |
          set -o pipefail
          python daily_morning_sync.py 2>&1 | tee "$RUNNER_TEMP/sync.log"

      - name: Cập nhật cache cho web Vercel (repo private daotaoatino-ctrl/work)
        # Chạy cả khi bước sync báo đỏ (cache đọc từ BigQuery nên vẫn đúng với dữ liệu hiện có); bỏ qua nếu bị huỷ.
        # Code web nằm ở repo private `work` nên checkout bằng PAT rồi chạy export tại đó,
        # tránh đưa web_app lên repo public này. Thiếu secret WORK_REPO_PAT → cảnh báo, bỏ qua.
        if: ${{ !cancelled() }}
        env:
          WORK_REPO_PAT: ${{ secrets.WORK_REPO_PAT }}
          TZ: Asia/Ho_Chi_Minh   # sync_status.json ghi giờ VN, không phải UTC của runner
        run: |
          if [ -z "$WORK_REPO_PAT" ]; then
            echo "::warning::Chưa có secret WORK_REPO_PAT — bỏ qua cập nhật cache Vercel"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${WORK_REPO_PAT}@github.com/daotaoatino-ctrl/work.git" "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          pip install -r requirements.txt
          cp "$GCP_KEY_PATH" gcp-key.json
          python export_dashboard_cache.py
          rm -f gcp-key.json
          git config user.name "Atino Auto Sync Bot"
          git config user.email "bot@atino.vn"
          git add web_app/cache_*.json web_app/sync_status.json
          if git diff --cached --quiet -- web_app/; then
            echo "Cache không đổi."
          else
            git commit -m "chore(cache): tự động cập nhật cache Vercel ($(date '+%Y-%m-%d %H:%M'))"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase -q origin main && git push origin HEAD:main; then pushed=1; break; fi
              sleep 5
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::Không đẩy được cache lên repo work (kiểm tra quyền Contents: write của WORK_REPO_PAT)"
              exit 1
            fi
            echo "Đã đẩy cache mới lên repo work → Vercel tự deploy."
          fi

      - name: Gửi báo cáo đơn lỗi Lark (sau khi sync xong)
        # Bot Render ngủ khi không có traffic → đánh thức bằng /health (thử tới ~3 phút) rồi mới POST.
        # Chỉ gửi khi sync không đỏ. Thiếu secret → cảnh báo, bỏ qua.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BOT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Thiếu secret BOT_URL/CRON_SECRET — bỏ qua gửi báo cáo Lark"
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            curl -fsS -m 40 -o /dev/null "$BOT_URL/health" && break
            sleep 10
          done
          code=$(curl -sS -m 60 -o /dev/null -w '%{http_code}' -X POST -H "X-Cron-Token: $CRON_SECRET" "$BOT_URL/api/invalid-approvals")
          echo "Bot trả HTTP $code"
          [ "$code" = 202 ] || { echo "::error::Kích hoạt báo cáo Lark thất bại (HTTP $code)"; exit 1; }

      - name: Cảnh báo Lark khi sync lỗi
        # Job đỏ, hoặc có bước phụ (vd 3/6 danh sách đơn) thất bại nhưng job vẫn xanh.
        if: ${{ always() }}
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(grep "THẤT BẠI:" "$RUNNER_TEMP/sync.log" 2>/dev/null | sed -e 's/.*THẤT BẠI: //' -e 's/ sau [0-9.]*s.*//' | head -5)
          if [ "$JOB_STATUS" = success ] && [ -z "$failed" ]; then exit 0; fi
          if [ -z "$BOT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Thiếu secret BOT_URL/CRON_SECRET — không gửi được cảnh báo Lark"
            exit 0
          fi
          msg="Sync 1Office → BigQuery có lỗi (job: $JOB_STATUS)."
          [ -n "$failed" ] && msg="$msg Bước lỗi: $(echo "$failed" | paste -sd ';' -)"
          msg="$msg Chi tiết: $RUN_URL"
          for i in 1 2 3 4 5 6; do
            curl -fsS -m 40 -o /dev/null "$BOT_URL/health" && break
            sleep 10
          done
          body=$(python3 -c 'import json,os,sys; print(json.dumps({"message": sys.argv[1]}))' "$msg")
          curl -fsS -m 60 -X POST -H "X-Cron-Token: $CRON_SECRET" -H "Content-Type: application/json" -d "$body" "$BOT_URL/api/sync-alert" || echo "::warning::Gửi cảnh báo Lark thất bại"

      - name: Xoá key BigQuery
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json" "$HOME/.dbt/profiles.yml"

      - name: Giữ repo hoạt động
        # GitHub tự tắt workflow hẹn giờ của repo public sau 60 ngày không có hoạt động.
        # Nếu commit cuối đã quá 45 ngày thì tạo 1 commit rỗng.
        if: ${{ !cancelled() }}
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (tránh GitHub tắt lịch chạy sau 60 ngày)"
            git push
          fi
